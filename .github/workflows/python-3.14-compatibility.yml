name: Python 3.14 compatibility

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python-314:
    name: Python 3.14 source compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install runtime dependencies for Python 3.14
        run: |
          uv venv --no-project --python 3.14
          uv pip install -r pyproject.toml

      - name: Run unit tests against the source
        run: .venv/bin/python -m unittest discover -s test -v
