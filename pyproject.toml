[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "discovery"
version = "1.0.1"
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.7.1",
]

[tool.setuptools]
packages = ["discovery"]

[tool.setuptools.package-data]
discovery = ["py.typed"]
